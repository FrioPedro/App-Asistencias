name: app_asistencias
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0
  shimmer: ^3.0.0
  dio: ^5.9.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  go_router: ^15.1.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.0
  animated_custom_dropdown: ^3.1.1
  workmanager: ^0.7.0
  intl: ^0.20.2
  wechat_assets_picker: 8.8.1+1
  wechat_camera_picker: 4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  isar_generator: 3.1.0+1
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.6

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
