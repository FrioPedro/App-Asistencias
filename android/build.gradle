allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Obliga a TODAS las librerías (incluyendo photo_manager) a usar esta versión
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
        }
    }

    // Evita que -Werror convierta warnings de deprecación en errores de build
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs.removeAll { it == '-Werror' }
            options.compilerArgs << '-Xlint:none'
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Mantenemos la estructura de evaluación obligatoria de Flutter
subprojects {
    project.evaluationDependsOn(':app')
}

// Mantenemos tu fix de isar intacto
subprojects { project ->
    if (project.name == "isar_flutter_libs") {
        project.afterEvaluate {
            if (project.hasProperty('android')) {
                project.android {
                    compileSdkVersion 35
                    if (namespace == null) {
                        namespace "dev.isar.isar_flutter_libs"
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}